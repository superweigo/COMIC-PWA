<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>純黑漫畫閱讀器</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; background: #000; color: #fff; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
    .card { background: #121212; border: 1px solid #333; border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.8); }
    h2 { font-size: 18px; margin-bottom: 16px; color: #10b981; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; font-size: 14px; margin-bottom: 12px; outline: none; }
    button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #059669; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
    button:active { background: #047857; }
    .secondary-btn { background: #374151; }
    .secondary-btn:active { background: #4b5563; }
    p { font-size: 12px; color: #888; margin-top: 12px; }
  </style>
</head>
<body>

<div class="card">
  <h2>📖 Pure Black Reader</h2>
  <input type="text" id="url-input" placeholder="貼上漫畫網址 (例: manhuagui.com/comic/xxx/)" />
  <button id="go-btn">前往閱讀</button>
  <button class="secondary-btn" id="paste-btn">📋 貼上剪貼簿網址</button>
  <p>點擊後將在全螢幕 PWA 模式下開啟漫畫頁，自動觸發你的純黑閱讀器Userscript。</p>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }

  const inputEl = document.getElementById("url-input");

  function navigateToComic(url) {
    if (!url) return;
    let target = url.trim();
    if (!target.startsWith("http://") && !target.startsWith("https://")) {
      target = "https://" + target;
    }
    // 跳轉至漫畫櫃，觸發 iOS Safari Userscript
    window.location.href = target;
  }

  document.getElementById("go-btn").onclick = () => {
    navigateToComic(inputEl.value);
  };

  document.getElementById("paste-btn").onclick = async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text) {
        inputEl.value = text;
        navigateToComic(text);
      }
    } catch (err) {
      alert("無法存取剪貼簿，請手動貼上網址");
    }
  };
</script>
</body>
</html>
